name: Build and Deploy Weather App

# Runs on every push/PR to main, and can also be triggered manually.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE_NAME: weather-app

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Package application jar
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-jar
          path: target/weather-app.jar
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Build & Smoke-Test Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-app:ci .

      - name: Run container
        run: docker run -d --name weather-app-ci -p 8080:8080 weather-app:ci

      - name: Wait for container to become healthy
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Container is up and responding."
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to respond within timeout." && docker logs weather-app-ci && exit 1

      - name: Stop container
        if: always()
        run: docker rm -f weather-app-ci || true

  # Publishes the image to Docker Hub. Only runs on a real push to main
  # (not on PRs, and not on workflow_dispatch from a branch other than
  # main) so forks/PRs never need Docker Hub credentials to pass CI.
  publish:
    name: Publish to Docker Hub
    needs: [ build, docker ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: SSH in and redeploy container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Optional: only needed if your instance uses a non-default SSH port
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

            echo "Pulling $IMAGE ..."
            docker pull "$IMAGE"

            echo "Stopping old container (if any) ..."
            docker stop weather-app || true
            docker rm weather-app || true

            echo "Starting new container ..."
            docker run -d \
              --name weather-app \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            echo "Cleaning up dangling images ..."
            docker image prune -f

            echo "Deployment complete."
            