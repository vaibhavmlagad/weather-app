name: Build and Deploy Weather App

# Runs on every push/PR to main, and can also be triggered manually.
# No database and no API key secrets are required - Open-Meteo's public
# APIs need neither.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Package application jar
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-jar
          path: target/weather-app.jar
          if-no-files-found: error
          retention-days: 14

  # Example deploy job: builds a runnable artifact and publishes it as a
  # GitHub Release so it can be downloaded and run anywhere with:
  #   java -jar weather-app.jar
  # Replace this job with your actual deploy target (e.g. a container
  # registry push, Azure/AWS/Render/Railway deploy step, etc.) as needed.
  deploy:
    name: Package Release Artifact
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build deployable jar
        run: mvn -B -DskipTests clean package

      - name: Verify jar runs (smoke check)
        run: |
          nohup java -jar target/weather-app.jar --server.port=8080 > app.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Application started successfully."
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start within timeout." && cat app.log && exit 1

      - name: Upload deployable jar
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-deployable
          path: target/weather-app.jar
          retention-days: 30
