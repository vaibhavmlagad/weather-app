# ------------------------------------------------------------------
# Weather Information Web Application
# No database and no API key are required - Open-Meteo's free public
# APIs are used for both geocoding and forecast data.
# ------------------------------------------------------------------

spring.application.name=weather-app
server.port=8080

# Thymeleaf: disable caching in dev so template edits are picked up instantly.
# (Safe to leave as-is in prod too; caching is re-enabled automatically
# when spring.thymeleaf.mode/prefix are unchanged and profile=prod is used,
# but for a simple, no-DB demo app keeping it simple is preferable.)
spring.thymeleaf.cache=false

# Basic logging
logging.level.root=INFO
logging.level.com.example.weather=INFO
